name: Android

# Distribution gate (plan §P3):
#  - unit tests include the config lab, which compiles every importable link type through the
#    real parser/compiler, so a protocol breakage fails CI instead of users;
#  - release builds run R8 with the shipped ProGuard rules, split per ABI, and are verified with
#    apksigner/zipalign before a draft release is created.
# The Xray core ships as the vendored `app/libs/libv2ray.aar`, so there is no Go/NDK step here;
# rebuilding that artifact is a separate, pinned job when the core version changes.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    name: Unit tests + config lab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew --no-daemon --console=plain :app:testDebugUnitTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest

  release:
    name: Signed release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set; refusing to ship an unsigned or dev-signed build"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build signed APKs and AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: upload
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # The tag is the source of truth for the version; the run number keeps the store code
          # strictly increasing even when two tags share a versionName.
          ./gradlew --no-daemon --console=plain :app:assembleRelease \
            -PversionName="$VERSION" -PversionCode="$GITHUB_RUN_NUMBER"
          # AGP's PerModuleBundleTask trips over ABI splits; the AAB carries every ABI regardless.
          ./gradlew --no-daemon --console=plain :app:bundleRelease -PabiSplits=false \
            -PversionName="$VERSION" -PversionCode="$GITHUB_RUN_NUMBER"

      - name: Verify signature, alignment and ABIs
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          shopt -s nullglob
          APKS=(app/build/outputs/apk/release/*.apk)
          if [ ${#APKS[@]} -eq 0 ]; then
            echo "::error::no release APK was produced"
            exit 1
          fi
          for apk in "${APKS[@]}"; do
            echo "== $apk"
            "$BUILD_TOOLS/apksigner" verify --print-certs "$apk" > /dev/null
            "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$apk" > /dev/null
            "$BUILD_TOOLS/aapt2" dump badging "$apk" \
              | grep -E "^package:|sdkVersion:|targetSdkVersion:|native-code:"
          done
          # The AAB is a signed JAR; signature verification uses jarsigner rather than apksigner.
          "$JAVA_HOME/bin/jarsigner" -verify app/build/outputs/bundle/release/*.aab

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/
          cp app/build/outputs/bundle/release/*.aab dist/
          cp app/build/outputs/mapping/release/mapping.txt dist/ || true
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: dist
          retention-days: 90

      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
